# NOTE: written but NOT executed in the build environment (Docker was unavailable there). Treat as a starting point.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: causalx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: causalx
    volumes: ["pgdata:/var/lib/postgresql/data"]
    profiles: ["postgres"]   # opt-in: docker compose --profile postgres up
  api:
    build: ./backend
    environment:
      CAUSALX_DATABASE_URL: ${CAUSALX_DATABASE_URL:-sqlite:////app/data/causalx.db}
      CAUSALX_DATA_DIR: /app/data
      CAUSALX_ARTIFACTS_DIR: /app/artifacts
    volumes: ["./data:/app/data", "./artifacts:/app/artifacts"]
    ports: ["8000:8000"]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  pgdata:
